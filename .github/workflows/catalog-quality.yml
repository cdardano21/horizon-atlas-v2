name: Quality Gates

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: catalog-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check catalog quality
        run: npm run check:catalog

      - name: Check internal references
        run: npm run check:references

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm exec -- tsc --noEmit

      - name: Unit tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm run test:e2e

  destination-quality-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --port 3001 > /tmp/horizon-start.log 2>&1 &
          for i in {1..40}; do
            if curl -sSf http://127.0.0.1:3001/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          cat /tmp/horizon-start.log
          exit 1

      - name: Run destination quality baseline
        run: npm run baseline:quality

      - name: Run production readiness audit
        run: npm run audit:production

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            docs/destination-quality-baseline.json
            docs/destination-quality-baseline.md
            docs/production-readiness-report.json
            docs/production-readiness-report.md
          if-no-files-found: error

  ci-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - static-quality
      - build
      - e2e-playwright
      - destination-quality-baseline

    steps:
      - name: CI checks passed
        run: echo "All required CI checks completed successfully."
